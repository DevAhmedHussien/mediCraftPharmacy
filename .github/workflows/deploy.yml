# =============================================================================
# Deploy — production from `main`, staging from `staging`.
#
# Two credentials, each doing one thing:
#   · AWS, via OIDC — a short-lived token whose role can push to ECR and
#     nothing else. It cannot change infrastructure.
#   · SSH, via a deploy key — reaches one instance, runs one script.
#
# The image is built for ARM64 because the server is Graviton. An amd64
# image pushed here would be pulled and fail to execute, with an error
# message about the exec format that does not obviously mean "wrong
# architecture".
# =============================================================================
name: Deploy

on:
  push:
    branches: [main, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    # ARM runner: builds the Graviton image natively. On an x86 runner the
    # same build goes through QEMU and takes roughly five times as long.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      AWS_REGION: us-east-1
      ENV_NAME: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Fail with a sentence somebody can act on.
      #
      # Deploy #2 through #6 all died here and none of them said why: an unset
      # `vars.AWS_DEPLOY_ROLE_ARN` reaches configure-aws-credentials as an
      # empty string, and the error it raises talks about credential providers
      # rather than about the variable nobody set. Three separate debugging
      # sessions went looking in AWS, where everything was correct.
      #
      # These are repository-level settings, so they cannot live in the repo
      # and a checkout cannot tell you they are missing. This step can.
      # ---------------------------------------------------------------------
      - name: Preflight — required repository configuration
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -uo pipefail
          missing=()
          [ -n "${ROLE_ARN}"   ] || missing+=("vars.AWS_DEPLOY_ROLE_ARN   — Settings → Secrets and variables → Actions → Variables")
          [ -n "${EC2_HOST}"   ] || missing+=("vars.EC2_HOST              — same place")
          [ -n "${SSH_KEY}"    ] || missing+=("secrets.EC2_SSH_KEY        — same page, Secrets tab")
          [ -n "${PUBLIC_URL}" ] || missing+=("vars.PUBLIC_URL            — used by the health check")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Deploy is not configured::${#missing[@]} required setting(s) are empty. Nothing was built or deployed."
            for m in "${missing[@]}"; do echo "  MISSING  $m"; done
            echo ""
            echo "For this repository the values are:"
            echo "  AWS_DEPLOY_ROLE_ARN = arn:aws:iam::<account>:role/medicraft-production-github-deploy"
            echo "  EC2_HOST            = the production instance's public IP or DNS"
            echo "  PUBLIC_URL          = https://www.medicraftpharmacy.com"
            exit 1
          fi
          echo "All four present."

      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          TAG="${ENV_NAME}-${GITHUB_SHA::12}"
          APP="${REGISTRY}/medicraft:${TAG}"
          MIG="${REGISTRY}/medicraft:${TAG}-migrate"

          # Tagged by commit, never `latest`: a rollback is then naming a tag
          # that still exists rather than hoping the old image survived.
          # `NEXT_PUBLIC_APP_URL` is baked into the CLIENT bundle at build
          # time — that is what NEXT_PUBLIC_ means — so it cannot be supplied
          # later from the container environment like every other value here.
          # Without it the Dockerfile's `ARG` resolves to an empty string and
          # the image ships with blank absolute URLs. Every manual build I
          # made passed it; this workflow never did, so an automated deploy
          # would have quietly produced a worse image than a hand-built one.
          docker build --platform linux/arm64 \
            --build-arg NEXT_PUBLIC_APP_URL="${PUBLIC_URL}" \
            -t "$APP" .
          docker build --platform linux/arm64 --target migrator -t "$MIG" .
          docker push "$APP"
          docker push "$MIG"

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "migrate=$MIG" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------
      # Deploy over SSM, not SSH.
      #
      # SSH cannot work from here: port 22 is open to one address and a
      # runner arrives from a different Azure IP every run. The options were
      # thousands of GitHub CIDRs (past a security group's rule limit),
      # opening 22 to the world, or not needing an inbound port at all.
      #
      # The agent is already installed and Online, so the command goes OUT
      # through AWS. The security group now needs no deploy rule at all.
      #
      # The deploy files travel as a base64 tarball inside the command rather
      # than through S3: six small files, no extra bucket, no extra IAM, and
      # nothing left behind if the run dies halfway.
      # -----------------------------------------------------------------
      - name: Deploy
        env:
          APP_IMAGE: ${{ steps.image.outputs.app }}
          MIGRATE_IMAGE: ${{ steps.image.outputs.migrate }}
        run: |
          set -euo pipefail

          # By tag, not by a stored id — a replaced instance would otherwise
          # leave a variable pointing at something that no longer exists.
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=medicraft-${ENV_NAME}" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "$INSTANCE_ID" != "None" ] || { echo "::error::No running instance tagged medicraft-${ENV_NAME}"; exit 1; }
          echo "Deploying to $INSTANCE_ID"

          PAYLOAD=$(tar -czf - -C deploy \
            docker-compose.yml Caddyfile fetch-secrets.sh backup.sh drain-outbox.sh migrate.sh \
            | base64 | tr -d '\n')

          # jq builds the parameter file so the script is never mangled by
          # shell quoting on its way into JSON.
          jq -n --arg payload "$PAYLOAD" --arg app "$APP_IMAGE" --arg mig "$MIGRATE_IMAGE" '
            { commands: [
                "set -euo pipefail",
                "cd /opt/medicraft",
                ("echo " + $payload + " | base64 -d | tar -xzf - -C /opt/medicraft"),
                "chmod +x fetch-secrets.sh backup.sh drain-outbox.sh migrate.sh",
                "install -m 755 backup.sh /usr/local/bin/medicraft-backup",
                "install -m 755 drain-outbox.sh /usr/local/bin/medicraft-drain-outbox",
                "echo \"*/5 * * * * root /usr/local/bin/medicraft-drain-outbox\" > /etc/cron.d/medicraft-outbox",
                "echo \"0 3 * * * root /usr/local/bin/medicraft-backup\" > /etc/cron.d/medicraft-backup",
                "./fetch-secrets.sh",
                # Absolute, because bash searches $PATH for a `source`
                # argument containing no slash — so `source .env.infra`
                # reports "file not found" while sitting in the directory
                # that holds it.
                ". /opt/medicraft/.env.infra",
                "sed -i \"/^APP_IMAGE=/d\" /opt/medicraft/.env",
                ("echo APP_IMAGE=" + $app + " >> /opt/medicraft/.env"),
                "set -a; . /opt/medicraft/.env.app; set +a",
                ("export APP_IMAGE=" + $app),
                "aws ecr get-login-password --region \"$AWS_REGION\" | docker login --username AWS --password-stdin \"$ECR_REGISTRY\"",
                "docker compose up -d postgres",
                "for i in $(seq 1 30); do docker compose exec -T postgres pg_isready -U medicraft -d medicraft >/dev/null 2>&1 && break; sleep 2; done",
                ("docker pull " + $mig),
                "NET=$(docker network ls --format \"{{.Name}}\" | grep -E \"^medicraft.*_default$\" | head -1)",
                "[ -n \"$NET\" ] || { echo \"Cannot find the compose network\"; exit 1; }",
                ("docker run --rm --network \"$NET\" -e DATABASE_URL=\"postgresql://medicraft:${POSTGRES_PASSWORD}@postgres:5432/medicraft?sslmode=disable\" " + $mig),
                "docker compose pull app caddy",
                "docker compose up -d",
                "docker image prune -f || true",
                "echo DEPLOY_OK"
              ] }' > /tmp/ssm.json

          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::12}" \
            --timeout-seconds 600 \
            --cli-input-json "$(jq -n --slurpfile p /tmp/ssm.json '{Parameters: $p[0]}')" \
            --query 'Command.CommandId' --output text)
          echo "SSM command $CMD"

          # Poll. `aws ssm wait` exists but gives no output on failure, and
          # the output is the only way to see which line of the deploy broke.
          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "--- stdout"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text | tail -40
          ERR=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text)
          [ -z "$ERR" ] || { echo "--- stderr"; echo "$ERR" | tail -40; }

          [ "$STATUS" = "Success" ] || { echo "::error::Deploy failed on the instance ($STATUS)"; exit 1; }

      - name: Health check
        env:
          HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail
          # Against the public hostname, through Caddy and TLS — the path a
          # real visitor takes. A check against localhost would pass while
          # the certificate or the proxy was broken.
          URL="${{ vars.PUBLIC_URL }}/api/health"
          for i in $(seq 1 12); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || true)
            [ "$CODE" = "200" ] && { echo "$URL → 200"; exit 0; }
            echo "  attempt $i: $CODE"
            sleep 10
          done
          echo "::error::$URL never returned 200 after the deploy."
          exit 1

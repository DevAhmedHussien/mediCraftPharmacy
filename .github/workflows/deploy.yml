# =============================================================================
# Deploy — production from `main`, staging from `staging`.
#
# Two credentials, each doing one thing:
#   · AWS, via OIDC — a short-lived token whose role can push to ECR and
#     nothing else. It cannot change infrastructure.
#   · SSH, via a deploy key — reaches one instance, runs one script.
#
# The image is built for ARM64 because the server is Graviton. An amd64
# image pushed here would be pulled and fail to execute, with an error
# message about the exec format that does not obviously mean "wrong
# architecture".
# =============================================================================
name: Deploy

on:
  push:
    branches: [main, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    # ARM runner: builds the Graviton image natively. On an x86 runner the
    # same build goes through QEMU and takes roughly five times as long.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    env:
      AWS_REGION: us-east-1
      ENV_NAME: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Fail with a sentence somebody can act on.
      #
      # Deploy #2 through #6 all died here and none of them said why: an unset
      # `vars.AWS_DEPLOY_ROLE_ARN` reaches configure-aws-credentials as an
      # empty string, and the error it raises talks about credential providers
      # rather than about the variable nobody set. Three separate debugging
      # sessions went looking in AWS, where everything was correct.
      #
      # These are repository-level settings, so they cannot live in the repo
      # and a checkout cannot tell you they are missing. This step can.
      # ---------------------------------------------------------------------
      - name: Preflight — required repository configuration
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -uo pipefail
          missing=()
          [ -n "${ROLE_ARN}"   ] || missing+=("vars.AWS_DEPLOY_ROLE_ARN   — Settings → Secrets and variables → Actions → Variables")
          [ -n "${EC2_HOST}"   ] || missing+=("vars.EC2_HOST              — same place")
          [ -n "${SSH_KEY}"    ] || missing+=("secrets.EC2_SSH_KEY        — same page, Secrets tab")
          [ -n "${PUBLIC_URL}" ] || missing+=("vars.PUBLIC_URL            — used by the health check")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Deploy is not configured::${#missing[@]} required setting(s) are empty. Nothing was built or deployed."
            for m in "${missing[@]}"; do echo "  MISSING  $m"; done
            echo ""
            echo "For this repository the values are:"
            echo "  AWS_DEPLOY_ROLE_ARN = arn:aws:iam::<account>:role/medicraft-production-github-deploy"
            echo "  EC2_HOST            = the production instance's public IP or DNS"
            echo "  PUBLIC_URL          = https://www.medicraftpharmacy.com"
            exit 1
          fi
          echo "All four present."

      - name: Assume the ECR push role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          TAG="${ENV_NAME}-${GITHUB_SHA::12}"
          APP="${REGISTRY}/medicraft:${TAG}"
          MIG="${REGISTRY}/medicraft:${TAG}-migrate"

          # Tagged by commit, never `latest`: a rollback is then naming a tag
          # that still exists rather than hoping the old image survived.
          docker build --platform linux/arm64 -t "$APP" .
          docker build --platform linux/arm64 --target migrator -t "$MIG" .
          docker push "$APP"
          docker push "$MIG"

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "migrate=$MIG" >> "$GITHUB_OUTPUT"

      - name: Copy the compose files to the server
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail
          install -m 600 /dev/stdin /tmp/deploy_key <<< "$SSH_KEY"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i /tmp/deploy_key deploy/docker-compose.yml "ec2-user@${HOST}:/opt/medicraft/docker-compose.yml"
          scp -i /tmp/deploy_key deploy/Caddyfile          "ec2-user@${HOST}:/opt/medicraft/caddy/Caddyfile"
          scp -i /tmp/deploy_key deploy/fetch-secrets.sh   "ec2-user@${HOST}:/opt/medicraft/fetch-secrets.sh"
          scp -i /tmp/deploy_key deploy/backup.sh          "ec2-user@${HOST}:/opt/medicraft/backup.sh"
          scp -i /tmp/deploy_key deploy/drain-outbox.sh    "ec2-user@${HOST}:/opt/medicraft/drain-outbox.sh"
          scp -i /tmp/deploy_key deploy/migrate.sh         "ec2-user@${HOST}:/opt/medicraft/migrate.sh"

      - name: Migrate, then deploy
        env:
          HOST: ${{ vars.EC2_HOST }}
          APP_IMAGE: ${{ steps.image.outputs.app }}
          MIGRATE_IMAGE: ${{ steps.image.outputs.migrate }}
        run: |
          set -euo pipefail
          ssh -i /tmp/deploy_key "ec2-user@${HOST}" APP_IMAGE="$APP_IMAGE" MIGRATE_IMAGE="$MIGRATE_IMAGE" 'bash -seuo pipefail' <<'REMOTE'
            cd /opt/medicraft
            source .env.infra

            chmod +x fetch-secrets.sh backup.sh drain-outbox.sh migrate.sh
            sudo install -m 755 backup.sh /usr/local/bin/medicraft-backup
            sudo install -m 755 drain-outbox.sh /usr/local/bin/medicraft-drain-outbox
            # Every five minutes. applyTransition enqueues rather than sends,
            # so without this the pipeline advances and no partner is told.
            echo "*/5 * * * * root /usr/local/bin/medicraft-drain-outbox" \
              | sudo tee /etc/cron.d/medicraft-outbox >/dev/null
            # 03:00 UTC daily. Rewritten every deploy so the schedule is
            # whatever this file says, not whatever was there before.
            echo "0 3 * * * root /usr/local/bin/medicraft-backup" | sudo tee /etc/cron.d/medicraft-backup >/dev/null

            sudo ./fetch-secrets.sh

            # Record the image in compose's own .env so that every later
            # `docker compose` command on this box — logs, ps, restart —
            # works without anyone exporting anything first.
            sudo sed -i '/^APP_IMAGE=/d' /opt/medicraft/.env
            echo "APP_IMAGE=$APP_IMAGE" | sudo tee -a /opt/medicraft/.env >/dev/null

            set -a; source .env.app; set +a
            export APP_IMAGE

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY" >/dev/null

            # Postgres first and on its own: the migration needs it, and on a
            # first deploy it does not exist yet.
            docker compose up -d postgres
            for i in $(seq 1 30); do
              docker compose exec -T postgres pg_isready -U medicraft -d medicraft >/dev/null 2>&1 && break
              sleep 2
            done

            # --- Migrations, as a gate -----------------------------------
            # Before the new image serves anything. A failure here leaves the
            # PREVIOUS version running and stops the deploy, which is the
            # whole reason this is not an application-startup step.
            echo "Running migrations…"
            docker pull "$MIGRATE_IMAGE"
            # The compose project is the directory name, so the network is
            # `medicraft_default`. Read from docker rather than assumed —
            # a renamed directory would otherwise fail with a confusing
            # "network not found" instead of a clear one.
            NET=$(docker network ls --format '{{.Name}}' | grep -E '^medicraft.*_default$' | head -1)
            [ -n "$NET" ] || { echo "::error::Cannot find the compose network"; exit 1; }

            if ! docker run --rm --network "$NET" \
              -e DATABASE_URL="postgresql://medicraft:${POSTGRES_PASSWORD}@postgres:5432/medicraft?sslmode=disable" \
              "$MIGRATE_IMAGE"; then
              echo "::error::Migrations failed. Nothing was deployed; the previous version is still serving."
              exit 1
            fi

            docker compose pull app caddy
            docker compose up -d
            docker image prune -f >/dev/null 2>&1 || true
          REMOTE

      - name: Health check
        env:
          HOST: ${{ vars.EC2_HOST }}
        run: |
          set -euo pipefail
          # Against the public hostname, through Caddy and TLS — the path a
          # real visitor takes. A check against localhost would pass while
          # the certificate or the proxy was broken.
          URL="${{ vars.PUBLIC_URL }}/api/health"
          for i in $(seq 1 12); do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || true)
            [ "$CODE" = "200" ] && { echo "$URL → 200"; exit 0; }
            echo "  attempt $i: $CODE"
            sleep 10
          done
          echo "::error::$URL never returned 200 after the deploy."
          exit 1

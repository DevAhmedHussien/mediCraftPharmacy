# =============================================================================
# CI — runs on every push and every pull request.
#
# Nothing here touches AWS or needs a secret. It is the gate that has to be
# green before deploy.yml will push an image anywhere: the deploy workflow
# depends on this one rather than repeating it, so a broken build cannot
# reach staging by way of a second, slightly different pipeline.
# =============================================================================
name: CI

on:
  push:
    # Everything EXCEPT the deploy branches. On main and staging this same
    # file already runs as deploy.yml's `verify` job, so leaving them in made
    # every push there run the suite twice — two npm installs, two Postgres
    # services, two of everything, for one commit.
    branches-ignore: [main, staging]
  pull_request:
  workflow_call: # deploy.yml calls this before it builds anything

concurrency:
  # One run per branch PER CALLER. A force-push mid-run cancels the stale one
  # rather than racing it to the finish.
  #
  # `github.workflow` is in the key because this file runs twice on a push to
  # main: once on its own `push` trigger, and once as deploy.yml's `verify`
  # job through `workflow_call`. Both saw `github.ref = refs/heads/main`, so
  # both landed in the same group — and with `cancel-in-progress: true` the
  # second to start killed the first. That is why every Deploy run since
  # Oct 5 is red and every CI run beside it died in three seconds.
  #
  # When called from deploy.yml, `github.workflow` is the CALLER's name, so
  # the two runs now occupy `ci-Deploy-…` and `ci-CI-…` and leave each other
  # alone. Same-branch re-pushes still cancel their own stale run, which is
  # what the rule was for.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The app talks to Postgres at build time? No — but `prisma generate`
    # wants a schema it can parse, and the unit tests import modules that
    # construct a client. A throwaway database costs nothing and removes the
    # class of failure where a test passes locally against a real database
    # and fails here against none.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: medicraft_ci
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ["5432:5432"]

    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/medicraft_ci
      # Values the env schema requires to parse. Not secrets — this database
      # is destroyed with the runner.
      AUTH_SECRET: ci-only-not-a-real-secret-0000000000000000
      FIELD_ENCRYPTION_KEY: ci0000000000000000000000000000000000000000000=
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches .nvmrc and the engines field. The Prisma CLI crashes on
          # Node 21 with an ESM resolution error, so this is load-bearing.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Apply migrations to the throwaway database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # ---------------------------------------------------------------------
      # The gates from docs/audit-report.md, as a build step.
      #
      # Everything in that report was measured by hand once. These three specs
      # are the same measurements run against a production build, so a
      # regression fails a pull request instead of reaching the site and
      # waiting for somebody to notice.
      #
      # They reuse the build above: `next build` has already written .next, so
      # the webServer in playwright.config.ts starts rather than rebuilds.
      # ---------------------------------------------------------------------
      - name: Install the browser Playwright drives
        run: npx playwright install --with-deps chromium

      - name: SEO, accessibility and motion
        run: npx playwright test
        env:
          # Both viewports. The serious a11y violations this suite exists to
          # catch appeared only at 375 — a desktop-only run reported all clear.
          CI: "true"

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
